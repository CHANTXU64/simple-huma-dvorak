patch:
  preset_color_schemes:
    macos14:
      name: "高仿 macOS 14"
      author: "Lufs X <i@isteed.cc>"

      font_face: "PingFangSC-Regular"
      font_point: 16
      label_font_face: "PingFangSC-Regular"
      label_font_point: 8
      comment_font_face: "PingFangSC-Regular"
      comment_font_point: 13

      label_format: "%s"
      candidate_format: "%c\u2003\u2003\u2003%@\u2004\u2001"
      candidate_list_layout: linear

      corner_radius: 8
      hilited_corner_radius: -1
      border_height: -5
      border_width: 3

      color_space: display_p3
      back_color: 0xEFEFEF
      border_color: 0xEFEFEF
      candidate_text_color: 0x464647
      comment_text_color: 0x3F000000
      label_color: 0x7F7F7F
      hilited_candidate_back_color: 0xD05925
      hilited_candidate_text_color: 0xFFFFFF
      hilited_comment_text_color: 0xDCDCDC
      hilited_candidate_label_color: 0xFFFFFF
      text_color: 0x3F000000
      hilited_text_color: 0xD8000000

    macos14_dark:
      name: "高仿暗色 macOS 14"
      author: "Lufs X <i@isteed.cc>"

      font_face: "PingFangSC-Regular"
      font_point: 16
      label_font_face: "PingFangSC-Regular"
      label_font_point: 8
      comment_font_face: "PingFangSC-Regular"
      comment_font_point: 13

      label_format: "%s"
      candidate_format: "%c\u2003\u2003\u2003%@\u2004\u2001"
      candidate_list_layout: linear

      corner_radius: 4
      hilited_corner_radius: -1
      border_height: -4
      border_width: 4

      color_space: display_p3
      back_color: 0x555557
      border_color: 0x0C0C0C
      candidate_text_color: 0xEEEEEE
      comment_text_color: 0x80FFFFFF
      label_color: 0x7C7C7C
      hilited_candidate_back_color: 0xCA5824
      hilited_candidate_text_color: 0xFFFFFF
      hilited_comment_text_color: 0xF0F0F0
      hilited_candidate_label_color: 0xFFFFFF
      text_color: 0x3F000000
      hilited_text_color: 0xD8000000

  show_notifications_when: never
  show_notifications_via_notification_center: true

  # 鼠须管默认让下面这些应用（终端、编辑器、启动器）以 ascii_mode 启动，而 librime 在
  # ascii_mode 下会禁用所有 when: has_menu 的按键绑定（s 次选、Ctrl+n/p 翻页），
  # 于是 s 变成"顶字上屏 + 打出 s"。本方案没有 ascii_composer，ascii_mode 本来就不起
  # 中英切换作用，统一关掉。只改 ascii_mode，各应用原有的 no_inline 等选项不动。
  "app_options/com.apple.Spotlight/ascii_mode": false
  "app_options/com.alfredapp.Alfred/ascii_mode": false
  "app_options/com.runningwithcrayons.Alfred-2/ascii_mode": false
  "app_options/com.blacktree.Quicksilver/ascii_mode": false
  "app_options/com.apple.Terminal/ascii_mode": false
  "app_options/com.googlecode.iterm2/ascii_mode": false
  "app_options/org.vim.MacVim/ascii_mode": false
  "app_options/com.apple.dt.Xcode/ascii_mode": false
  "app_options/com.barebones.textwrangler/ascii_mode": false
  "app_options/com.macromates.TextMate.preview/ascii_mode": false
  "app_options/com.github.atom/ascii_mode": false
  "app_options/com.microsoft.VSCode/ascii_mode": false
  "app_options/com.sublimetext.2/ascii_mode": false
  "app_options/org.gnu.Aquamacs/ascii_mode": false
  "app_options/org.gnu.Emacs/ascii_mode": false
  "app_options/co.zeit.hyper/ascii_mode": false

  style:
    color_scheme: macos14
    color_scheme_dark: macos14_dark
    translucency: true # 背景半透明总开关，不需要关掉即可
    horizontal: true             # true横排，false竖排
    text_orientation: horizontal # horizontal | vertical
    inline_preedit: true

    line_spacing: 1
    spacing: 10

    memorize_size: false

    # 鼠须管盲打，嵌入首选，删除下面两行的#号，即可生效
    # alpha: 0.0001

