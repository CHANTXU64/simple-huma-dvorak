# 中文标点配置
punctuator:
  half_shape:
    "w" : "，"
    "v" : "。"
    "<" : "《"
    ">" : "》"
    "/" : "、"
    "?" : "？"
    ";" : "；"
    ":" : "："
    "'" : { pair: ["'", "'"] }
    '"' : { pair: ['"', '"'] }
    "\\" : "、"
    "|" : "·"
    "`" : "·"
    "~" : "～"
    "!" : "！"
    "@" : "@"
    "#" : "#"
    "%" : "%"
    "$" : "￥"
    "^" : "……"
    "&" : "&"
    "*" : "*"
    "(" : "（"
    ")" : "）"
    "-" : "－"
    "_" : "——"
    "+" : "+"
    "=" : "="
    "[" : "【"
    "]" : "】"
    "{" : "｛"
    "}" : "｝"
